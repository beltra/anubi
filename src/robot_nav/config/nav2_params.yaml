# nav2_params.yaml
# Robot-agnostic Nav2 configuration.
# Tuned for a Unitree Go2 quadruped navigation stack.
#
# Localisation is provided by slam_toolbox (map → odom TF).
# Odometry (odom → base_footprint) is provided by go2_hw_bridge.
#
# ASSUMPTIONS:
#   A-NAV-1: Robot is configured as holonomic in DWB with constrained lateral motion.
#   A-NAV-2: Deskewed LiDAR PointCloud2 on /lidar/points_undistorted is used for costmaps.
#            LaserScan on /scan (lidar_stabilized frame) is used by slam_toolbox.
#   A-NAV-3: map → odom is published by slam_toolbox (not AMCL).
#             AMCL section below is kept for reference but excluded from lifecycle.
#   A-NAV-4: Nav2 Humble publishes geometry_msgs/Twist on /cmd_vel.
#             go2_hw_bridge converts this directly to sport API Move commands.
#
# NOTE — use_sim_time: true appears on every node below.
#   nav2_bringup's RewrittenYaml rewrites ALL occurrences of use_sim_time at
#   launch time when use_sim_time:=true is passed (sim) or false (hardware).
#   The value written here is irrelevant at runtime; it is always overridden.
#
# NOTE — lifecycle_manager section below is NOT read by nav2_bringup.
#   navigation_launch.py creates its own lifecycle_manager node with a hardcoded
#   node list.  The section is kept here for documentation purposes only.

# ═══════════════════════════════════════════════════════════════════════════════
# amcl — Adaptive Monte Carlo Localisation
# Used when navigating on a pre-built map.  Disabled when using SLAM-only mode.
# Localization tuning backlog: tune alpha, laser, and initial pose params for Go2 IMU motion.
# ═══════════════════════════════════════════════════════════════════════════════
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0  # KLD recovery disabled — slam_toolbox owns localisation, AMCL is reference only
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

# ═══════════════════════════════════════════════════════════════════════════════
# map_server
# ═══════════════════════════════════════════════════════════════════════════════
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""  # Overridden via launch argument --map

# ═══════════════════════════════════════════════════════════════════════════════
# map_saver
# ═══════════════════════════════════════════════════════════════════════════════
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ═══════════════════════════════════════════════════════════════════════════════
# planner_server
# Uses SmacPlannerLattice for reliable global path planning in grid maps.
# ═══════════════════════════════════════════════════════════════════════════════
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0        # Go2 can walk backward but forward is preferred
      change_penalty: 0.05        # low: direction changes are cheap for legged robots
      non_straight_penalty: 1.05  # very low: diagonal travel is fine
      cost_penalty: 2.0
      rotation_penalty: 5.0       # moderate: rotation costs energy but is not forbidden
      retrospective_penalty: 0.025
      lattice_filepath: "./lattice_omni_5.json"        
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

# # ═══════════════════════════════════════════════════════════════════════════════
# # smoother_server
# # ═══════════════════════════════════════════════════════════════════════════════
# smoother_server:
#   ros__parameters:
#     use_sim_time: true
#     smoother_plugins: ["simple_smoother"]
#     simple_smoother:
#       plugin: "nav2_smoother::SimpleSmoother"
#       tolerance: 1.0e-10
#       max_its: 1000
#       do_refinement: true

# ═══════════════════════════════════════════════════════════════════════════════
# controller_server
# Uses DWB (Dynamic Window Approach with critics) as the local trajectory planner.
# ═══════════════════════════════════════════════════════════════════════════════
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5      # was 0.3 (6 cycles) — too short; 0.5 s = 10 cycles before recovery
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # FIX(agent3): holonomic: true is required when min_vel_y / max_vel_y are set.
      # Without it, DWB ignores lateral velocity samples and treats the robot as
      # differential-drive, making the y-velocity parameters ineffective.
      holonomic: true
      # DWB does not define a separate footprint polygon here; it inherits
      # collision geometry from the active local/global costmap footprint.

      # Velocity limits (Go2 physically constrained safe nav defaults)
      min_vel_x: 0.0
      min_vel_y: -0.2
      max_vel_x: 0.8
      max_vel_y: 0.2
      min_vel_theta: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.05

      # Acceleration limits
      acc_lim_x: 0.4
      acc_lim_y: 0.2
      acc_lim_theta: 1.0
      decel_lim_x: -0.8
      decel_lim_y: -0.4
      decel_lim_theta: -1.5

      # Sampling
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05  # was 0.25 (50% of max_vel_x) — caused RotateToGoal to trigger while still moving
      short_circuit_trajectory_evaluation: true
      stateful: true

      # DWB critics
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]

      ObstacleFootprint.scale: 1.5    # score collisions using the full padded body
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 20.0
      GoalDist.scale: 14.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0  # -1.0 = auto-compute from current speed

# ═══════════════════════════════════════════════════════════════════════════════
# local_costmap
# Uses STVL for rolling 3-D obstacle handling from the LiDAR point cloud.
# ═══════════════════════════════════════════════════════════════════════════════
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: "base_footprint"
      rolling_window: true
      width:  20
      height: 20
      resolution: 0.05
      update_frequency:  15.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      # Industrial safety footprint: physical 0.70 x 0.31 m standing envelope
      # with 50 mm extra margin on each side.
      footprint: "[ [-0.40, -0.205], [-0.40, 0.205], [0.40, 0.205], [0.40, -0.205] ]"
      footprint_padding: 0.03

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 10.0         # retain hazards through short occlusions in industrial aisles
        decay_model: 0            # 0 = linear decay
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark
        lidar_mark:
          data_type: PointCloud2
          topic: /lidar/points_undistorted
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 10.0
          # Ground rejection: the 2-D EKF does not track body pitch, so a static
          # base_footprint→base_link TF is used.  During CHAMP locomotion the body
          # can pitch ±5°; at 3 m range this shifts ground returns to
          # z ≈ 3·sin(5°) ≈ 0.26 m in the odom frame.  Setting the floor to 0.25 m
          # rejects these false obstacles while still detecting anything above
          # ankle height (~10 cm real-world clearance at the robot's feet).
          min_obstacle_height: 0.25
          max_obstacle_height: 2.3
          expected_update_rate: 0.0      # 0.0 = accept updates at any rate (LiDAR publishes at 10 Hz)
          observation_persistence: 0.0   # 0.0 = discard raw observations immediately; voxel_decay handles temporal filtering
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 1
          clear_after_reading: true
          sensor_origin_frame: lidar_link  # explicit: match URDF link name (l1_lidar macro, prefix="")
          max_z: 2.5    # STVL voxel volume upper bound (m above lidar_link origin; covers standing humans)
          min_z: -0.25    # STVL voxel volume lower bound (ground plane, no below-ground voxels)

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.5
        inflate_unknown: false
        inflate_around_unknown: false

# ═══════════════════════════════════════════════════════════════════════════════
# global_costmap
# Static map layer + obstacle overlay from /scan.
# Assumption A-NAV-3: a map YAML file is provided at launch time.
# For mapless / SLAM-only operation, comment out the static_layer plugin.
# ═══════════════════════════════════════════════════════════════════════════════
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      # FIX(agent3): set rolling_window: true for SLAM mode (static_layer removed from plugins).
      # For localization mode, set false and restore static_layer plugin.
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: false
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      footprint: "[ [-0.40, -0.205], [-0.40, 0.205], [0.40, 0.205], [0.40, -0.205] ]"
      footprint_padding: 0.03

      # FIX(agent3): SLAM mode — rolling_window: true is set above; static_layer removed here
      # because Nav2 Humble ignores the static layer when rolling_window: true, causing a
      # silent conflict. For localization mode (pre-built map + AMCL), set rolling_window: false
      # and restore: plugins: ["static_layer", "voxel_layer", "obstacle_layer", "inflation_layer"]
      # and re-add the static_layer block below.
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.25
        max_obstacle_height: 2.3
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: cloud
        cloud:
          topic: /lidar/points_undistorted
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.25
          max_obstacle_height: 2.5
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.05
          raytrace_max_range: 10.0
          inf_is_valid: false
          expected_update_rate: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.6
        inflate_unknown: false
        inflate_around_unknown: false

# ═══════════════════════════════════════════════════════════════════════════════
# bt_navigator
# ═══════════════════════════════════════════════════════════════════════════════
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Default Nav2 BT — handles replanning and recovery automatically
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Plugin list verified against libraries present in ros-humble-navigation2.
    # Checked via: find /opt/ros/humble/lib -name "libnav2*bt*" | sort
    plugin_lib_names:
      # ── Action nodes ─────────────────────────────────────────────────────
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      # ── Condition nodes ───────────────────────────────────────────────────
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      # ── Decorator / control nodes ─────────────────────────────────────────
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      # ── Selector nodes ────────────────────────────────────────────────────
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_progress_checker_selector_bt_node

# ═══════════════════════════════════════════════════════════════════════════════
# behavior_server  (recovery behaviours)
# ═══════════════════════════════════════════════════════════════════════════════
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic:  local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic:  local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.2
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

# ═══════════════════════════════════════════════════════════════════════════════
# waypoint_follower
# ═══════════════════════════════════════════════════════════════════════════════
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ═══════════════════════════════════════════════════════════════════════════════
# velocity_smoother
# ═══════════════════════════════════════════════════════════════════════════════
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.2, 1.0]
    min_velocity: [0.0, -0.2, -1.0]
    max_accel: [0.4, 0.2, 1.0]
    max_decel: [-0.8, -0.4, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.01]
    velocity_timeout: 1.0

# ═══════════════════════════════════════════════════════════════════════════════
# lifecycle_manager  (navigation)
# ═══════════════════════════════════════════════════════════════════════════════
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # slam_toolbox and map_server are NOT in this list:
    #   - slam_toolbox manages its own lifecycle.
    #   - map_server is not needed when slam_toolbox provides the map.
    # Add map_server + amcl here if switching to AMCL + pre-built map mode.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
