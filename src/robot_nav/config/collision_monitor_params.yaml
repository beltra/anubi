collision_monitor:
  ros__parameters:
    # Placeholder so nav2.launch.py can rewrite this to true in simulation.
    use_sim_time: true
    enabled: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_collision_free"
    state_topic: "/collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    # INDUSTRIAL SAFETY: treat unmapped / unknown costmap cells as occupied so
    # that the monitor never assumes a gap is passable when the costmap source
    # is active (e.g. after a recovery clear or in an unseen region).
    treat_unknown_as_obstacle: false

    # Explicit QoS keeps the LiDAR bridge and collision monitor on BEST_EFFORT.
    qos_overrides:
      /lidar/points_undistorted:
        subscription:
          reliability: best_effort
          durability: volatile

    polygons: ["ApproachZone", "SlowZone", "StopZone"]

    ApproachZone:
      type: "circle"
      radius: 3.0
      action_type: "slowdown"
      slowdown_ratio: 0.6
      max_points: 0
      visualize: True
      polygon_pub_topic: "/collision_monitor/approach_zone"
      enabled: True

    SlowZone:
      type: "circle"
      radius: 1.5
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 0
      visualize: True
      polygon_pub_topic: "/collision_monitor/slow_zone"
      enabled: True

    StopZone:
      type: "circle"
      radius: 0.6
      action_type: "stop"
      max_points: 0
      visualize: True
      polygon_pub_topic: "/collision_monitor/stop_zone"
      enabled: True

    # NOTE: Nav2 Humble collision_monitor only supports pointcloud/scan/range sources.
    # The "costmap" source type is Iron+ only — do not add it here.
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/lidar/points_undistorted"
      min_height: 0.05
      max_height: 2.5   # covers tall warehouse racks + standing humans with margin
      min_range: 0.1
      enabled: True
      source_timeout: 0.5
