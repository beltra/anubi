# scan_from_cloud.yaml
# Parameters for pointcloud_to_laserscan_node.
# Converts /lidar/points_undistorted (3D PointCloud2) to /scan (2D LaserScan)
# for slam_toolbox and 2D obstacle layers.
#
# The Unitree L1 LiDAR spans 360° horizontal and 90° vertical FOV.
# We extract a horizontal slice around the LiDAR's equatorial plane to produce
# a representative 2D laser scan.
#
# ASSUMPTIONS:
#   A-SCAN-1: lidar_stabilized is a gravity-leveled frame co-located with the
#             nominal LiDAR origin and aligned with robot yaw only.
#   A-SCAN-2: min_height/max_height are relative to the stabilized LiDAR origin.
#             The slice is centred on the horizontal plane of lidar_stabilized.
#   A-SCAN-3: LiDAR min range is 0.05 m.

pointcloud_to_laserscan:
  ros__parameters:
    # Output frame for the LaserScan.
    # Must be a frame that slam_toolbox can look up relative to base_footprint.
    target_frame: base_footprint  # Assumption A-SCAN-1

    transform_tolerance: 0.05      # [s] TF lookup timeout

    # Height filter (relative to target_frame = base_footprint origin)
    # The L1 LiDAR is at z ≈ 0.233 m above base_footprint.  Near-horizontal
    # obstacle returns arrive at approximately that height.  The band must be
    # centred on the LiDAR height and wide enough to accommodate ±5° body
    # pitch during CHAMP locomotion.
    # NOTE: some ground returns may slip through at close range with body
    # pitch, but slam_toolbox handles sparse ground noise well.  The costmap
    # layers use a higher min_obstacle_height (0.25 m) for tighter rejection.
    min_height: 0.10            # [m]  ~13 cm below LiDAR — captures horizontal returns
    max_height: 0.55            # [m]  ~32 cm above LiDAR — captures pitched-up returns

    # Angular scan parameters
    angle_min: -3.14159265         # [rad] -180°
    angle_max:  3.14159265         # [rad] +180°
    # Match the simulated horizontal sampling (360 points / revolution).
    angle_increment: 0.01745329    # [rad] 1.0°

    scan_time: 0.1                 # [s] 10 Hz
    range_min: 0.15                # [m]  Unitree L1 minimum range + safety
    range_max: 30.0                # [m]  Unitree L1 practical maximum range for sim stability

    use_inf: false                  # Publish inf for out-of-range points (not NaN)
    inf_epsilon: 1.0               # [m] inf offset
