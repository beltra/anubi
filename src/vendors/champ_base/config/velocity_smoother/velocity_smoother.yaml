# Velocity limits aligned with gait.yaml and go2_params.yaml.
# Limits here are ~10% above the gait limits so CHAMP can track
# commanded velocities without the smoother being the bottleneck.

# Mandatory parameters
speed_lim_v_x: 1.6   # gait max_linear_velocity_x = 1.5; +7%
speed_lim_v_y: 0.45  # gait max_linear_velocity_y = 0.4; +12%

speed_lim_w: 1.35    # gait max_angular_velocity_z = 1.2; +12%

accel_lim_v: 1.0
accel_lim_w: 2.0

# Optional parameters
frequency: 10.0
decel_factor: 1.0

# Robot velocity feedback type:
#  0 - none
#  1 - odometry
#  2 - end robot commands
robot_feedback: 2