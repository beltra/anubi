# gait.yaml
# CHAMP gait parameters for the Unitree Go2.
#
# Source: khaledgabr77/unitree_go2_ros2 / unitree_go2_sim/config/gait/gait.yaml
# Copied verbatim — gait ratios are dimensionless and simulator-independent.
/**:
  ros__parameters:
    gait:
      knee_orientation : ">>"
      pantograph_leg : false
      odom_scaler: 0.9
      max_linear_velocity_x : 1.5
      max_linear_velocity_y : 0.4    # Go2 SDK lateral limit; matches go2_params.yaml max_lateral_vel
      max_angular_velocity_z : 1.2   # Go2 can sustain ~1.5 rad/s; 1.2 keeps headroom for stability
      com_x_translation: 0.2
      swing_height : 0.045           # restored: 40 mm caused ground clipping in sim
      stance_depth : 0.00
      stance_duration : 0.22         # restored: 0.25 s overshot duty factor, destabilised trot
      nominal_height : 0.280  # must match standing_height in go2_description/urdf/go2.urdf.xacro
