# DLIO parameters for the Go2 + Unitree L1 LiDAR (real robot).
#
# Frame strategy:
#   frames/baselink = base_link (not base_footprint) so extrinsics remain rigid.
#   /lidar_odom therefore has child_frame_id: base_link - it MUST be consumed
#   by the EKF (ekf.launch.py) before reaching Nav2 or slam_toolbox.
#   Private DLIO frames (dlio_lidar_link, dlio_imu_link) avoid TF collisions
#   with URDF-owned frames.

/**:
  ros__parameters:
    use_sim_time: false
    publish_tf: false
    map/waitUntilMove: true

    frames/odom: odom
    frames/baselink: base_link
    frames/lidar: dlio_lidar_link
    frames/imu: dlio_imu_link

    adaptive: false
    pointcloud/deskew: true
    pointcloud/voxelize: true
    odom/preprocessing/voxelFilter/res: 0.25

    odom/computeTimeOffset: true
    odom/imu/approximateGravity: true
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 5000

    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 0.5

    # Keyframe thresholds: build a new submap keyframe every 20 cm or 20 deg.
    # DLIO compares rotation in degrees, so 20.0 means 20 degrees.
    odom/keyframe/threshD: 0.20
    odom/keyframe/threshR: 20.0

    # base_link -> raw Unitree LiDAR frame, derived from
    # /utlidar/cloud -> /utlidar/cloud_base point matches.
    extrinsics/baselink2lidar/t: [0.28945, 0.0, -0.046825]
    extrinsics/baselink2lidar/R: [-0.9659793436, 0.0, 0.2586192332,
                                    0.0,          1.0, 0.0,
                                   -0.2586192332, 0.0, -0.9659793436]

    # base_link -> raw LiDAR IMU frame. The IMU uses a different axis convention
    # from the pointcloud and still needs bias/cross-axis handling for LIO work.
    extrinsics/baselink2imu/t: [0.283739, 0.014655, -0.055260]
    extrinsics/baselink2imu/R: [ 0.96593,  0.0,  0.25882,
                                  0.0,     -1.0,  0.0,
                                  0.25882,  0.0, -0.96593]
