# DLIO parameters for the Go2 Gazebo simulation.
#
# The sim URDF mounts the LiDAR right-side-up with only a -15 deg pitch to work
# around a Fortress gpu_lidar rendering bug (real robot uses roll=pi, pitch=-15 deg).
# Extrinsics here must match the sim URDF or LiDAR/IMU fusion will be inconsistent.

/**:
  ros__parameters:
    use_sim_time: true
    publish_tf: false
    map/waitUntilMove: true

    frames/odom: odom
    frames/baselink: base_link
    frames/lidar: dlio_lidar_link
    frames/imu: dlio_imu_link

    adaptive: false
    pointcloud/deskew: true
    pointcloud/voxelize: true
    odom/preprocessing/voxelFilter/res: 0.10

    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 0.5

    # Keyframe thresholds are in meters and degrees.
    odom/keyframe/threshD: 0.20
    odom/keyframe/threshR: 20.0

    odom/computeTimeOffset: false
    odom/imu/approximateGravity: true
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 5000

    odom/geo/Kab: 0.85

    # base_link -> lidar_link (sim mount); URDF rpy (0, -pi/12, 0)
    # R = Ry(-pi/12)
    extrinsics/baselink2lidar/t: [0.28945, 0.0, -0.046825]
    extrinsics/baselink2lidar/R: [ 0.9659258263,  0.0, -0.2588190451,
                                   0.0,           1.0,  0.0,
                                   0.2588190451,  0.0,  0.9659258263]

    # base_link -> lidar_imu_link (sim mount)
    # = lidar_in_base + R_base_to_lidar(sim) * imu_in_lidar
    extrinsics/baselink2imu/t: [0.28028798, -0.014655, -0.042374664]
    extrinsics/baselink2imu/R: [ 0.9659258263,  0.0, -0.2588190451,
                                 0.0,           1.0,  0.0,
                                 0.2588190451,  0.0,  0.9659258263]
