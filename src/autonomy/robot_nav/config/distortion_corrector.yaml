# LiDAR motion deskew parameters for the Unitree L1 on the Go2.

distortion_corrector:
  ros__parameters:
    input_topic: /lidar/points
    output_topic: /lidar/points_undistorted
    odom_topic: /odom
    imu_topic: /imu/data

    use_twist: true
    use_imu: true
    use_3d_distortion_correction: true
    # Real L1 cloud carries per-point `time` field (FLOAT32 seconds, range ~0-0.097);
    # sim overrides this to false because Fortress gpu_lidar omits time fields.
    deskew_enabled: true

    # Real /utlidar/cloud frame from matching /utlidar/cloud to /utlidar/cloud_base.
    # raw->base is Ry(2.88000012056847); inverse mode stores base->raw here.
    sensor_mount_rpy: [0.0, -2.88000012056847, 0.0]
    mount_rotation_mode: inverse

    scan_period: 0.1  # L1 rotates at 10 Hz

    timestamp_field_name: ""
    timestamp_field_candidates: ["time_stamp", "timestamp", "time", "t"]
    timestamp_unit: auto
    # Non-repetitive L1 has no meaningful azimuth ordering; drop frames instead
    # of fabricating relative times if the driver ever stops emitting `time`.
    fallback_mode: disabled
    azimuth_direction: cw

    imu_timeout_sec: 0.25
    odom_timeout_sec: 0.25

    publish_diagnostics: false
    diagnostics_topic: /diagnostics/lidar_correction

    # Preserve input timestamp so downstream TF lookups use the acquisition time.
    # Using "now" caused 13-20 ms shifts that smeared the SLAM map.
    output_stamp_mode: input

    # Gravity alignment: rotate deskewed points to lidar_stabilized.
    # Requires lidar_level_frame_publisher to broadcast the lidar_stabilized TF.
    gravity_align: true
    gravity_align_frame: lidar_stabilized

    # Self-filter removes robot-body and leg returns; it does not remove
    # ground/floor (floor sits at z<=-0.45 in base_link when standing, just
    # below the box). robot_min_z lowered from -0.25 to -0.40 so the full
    # standing leg span (tibia + thigh) is filtered. Previously legs below
    # the body box reached /lidar/points_undistorted and showed up as
    # spurious near-robot obstacles in /scan and STVL.
    filter_self: true
    robot_min_x: -0.40
    robot_max_x: 0.36
    robot_min_y: -0.20
    robot_max_y: 0.20
    robot_min_z: -0.40
    robot_max_z: 0.10
    min_radius: 0.12

    # Sensor position in base_link frame (from go2_description URDF)
    sensor_x_in_base: 0.28945
    sensor_y_in_base: 0.0
    sensor_z_in_base: -0.046825
