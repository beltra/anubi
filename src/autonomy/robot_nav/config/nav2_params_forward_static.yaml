# Forward-static comparison profile: SmacPlanner2D + DiffDrive MPPI + STVL local costmap.
# use_sim_time is rewritten at launch.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""  # overridden via --map launch argument

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 5.0
      use_astar: true
      motion_model_for_search: "VON_NEUMANN"
      downsample_costmap: false
      cost_travel_multiplier: 30.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0   # match model_dt and the downstream 20 Hz command shaping in sim
    costmap_update_timeout: 0.30
    speed_limit_topic: "speed_limit"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      transform_tolerance: 0.1
      prune_distance: 1.7
      time_steps: 40
      model_dt: 0.05
      batch_size: 1500
      iteration_count: 2
      temperature: 0.5
      gamma: 0.015
      regenerate_noises: true
      visualize: true
      publish_optimal_trajectory: true

      # Forward-biased comparison profile: no meaningful lateral control.
      vx_max: 0.8
      vx_min: -0.3
      vy_max: 0.0
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.5
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.5

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "TwirlingCritic", "VelocityDeadbandCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0
        critical_weight: 20.0
        collision_cost: 1000000.0
        collision_margin_distance: 0.12
        near_goal_distance: 0.35
        consider_footprint: true
        inflation_radius: 0.80
        cost_scaling_factor: 2.2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.10

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.5

      TwirlingCritic:
        enabled: false
        cost_power: 1
        cost_weight: 10.0

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.03, 0.50, 0.02]

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: "base_footprint"
      rolling_window: true
      width:  20
      height: 20
      resolution: 0.05
      update_frequency:  10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      # Go2 standing envelope: 0.70 m x 0.31 m
      footprint: "[ [-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155] ]"
      footprint_padding: 0.03

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.1
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark
        lidar_mark:
          data_type: PointCloud2
          topic: /lidar/points_undistorted
          marking: true
          clearing: true
          obstacle_range: 6.0
          raytrace_range: 8.0
          min_obstacle_height: 0.12
          max_obstacle_height: 2.3
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2       # reject single-point ghost returns
          clear_after_reading: true
          sensor_origin_frame: lidar_stabilized
          max_z: 2.5
          min_z: -0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.80
        inflate_unknown: false
        inflate_around_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      width: 30
      height: 30
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: false
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      footprint: "[ [-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155] ]"
      footprint_padding: 0.03

      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.15
        max_obstacle_height: 2.3
        unknown_threshold: 15
        mark_threshold: 1
        combination_method: 1
        observation_sources: cloud
        cloud:
          topic: /lidar/points_undistorted
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.15
          max_obstacle_height: 2.3
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.05
          raytrace_max_range: 8.0
          inf_is_valid: false
          expected_update_rate: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.85
        inflate_unknown: false
        inflate_around_unknown: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_progress_checker_selector_bt_node

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic:  local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic:  local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.3   # matches gait.yaml max_angular_velocity_z
    min_rotational_vel: 0.02
    rotational_acc_lim: 1.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz] limits consistent with gait.yaml
    max_velocity: [0.8, 0.0, 1.9]
    min_velocity: [-0.3, 0.0, -1.9]
    max_accel: [3.0, 0.0, 3.5]
    max_decel: [-3.0, 0.0, -3.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.03, 0.50, 0.02]
    velocity_timeout: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

route_server:
  ros__parameters:
    use_sim_time: true
    route_frame: "map"
    graph_filepath: ""
    graph_file_loader: "GeoJsonGraphFileLoader"
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"
    operations: ["ReroutingService"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    path_density: 0.5

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # slam_toolbox manages its own lifecycle and is not listed here.
    # Add map_server + amcl when switching to AMCL + pre-built map mode.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
