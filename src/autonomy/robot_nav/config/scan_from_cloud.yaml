# pointcloud_to_laserscan parameters for the Unitree L1 LiDAR.
# Converts /lidar/points_undistorted (PointCloud2) to /scan (LaserScan) for slam_toolbox.
# Height slice is relative to lidar_stabilized (gravity-levelled frame).

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: lidar_stabilized
    transform_tolerance: 0.3

    # Asymmetric horizontal slice in lidar_stabilized (gravity-levelled).
    # Original +/-0.12 m gave only ~4% angular coverage per frame because the
    # cloud's dense band sits below z=0 (rings pointing slightly downward).
    # Going to a symmetric +/-0.30 m pulls in the densest band but that band
    # includes returns from the Go2's own legs (legs extend below z=-0.25 in
    # base_link, which is outside the self_filter box), producing false-
    # positive obstacles around the robot. The current asymmetric window
    # (-0.20 to +0.50) cuts the leg-return band while widening upward (above
    # the LiDAR there are no body parts) to capture more wall/people rings.
    min_height: -0.25
    max_height:  0.50

    angle_min: -3.14159265
    angle_max:  3.14159265
    angle_increment: 0.00872665

    scan_time: 0.1
    range_min: 0.5
    range_max: 25.0

    use_inf: true
    inf_epsilon: 1.0
