# scan_from_cloud.yaml
# Parameters for pointcloud_to_laserscan_node.
# Converts /lidar/points_undistorted (3D PointCloud2) to /scan (2D LaserScan)
# for slam_toolbox and 2D obstacle layers.
#
# The Unitree L1 LiDAR spans 360 deg horizontal and 90 deg vertical FOV.
# We extract a horizontal slice around the LiDAR's equatorial plane to produce
# a representative 2D laser scan.
#
# ASSUMPTIONS:
#   A-SCAN-1: lidar_stabilized is a gravity-leveled frame co-located with the
#             nominal LiDAR origin and aligned with robot yaw only.
#   A-SCAN-2: min_height/max_height are relative to the stabilized LiDAR origin.
#             The slice is centred on the horizontal plane of lidar_stabilized.
#   A-SCAN-3: LiDAR min range for this pipeline is 0.15 m.

pointcloud_to_laserscan:
  ros__parameters:
    # Output frame for the LaserScan.
    # Use a leveled frame co-located with the lidar so scan extraction does not
    # depend on the robot's standing height or body pitch/roll.
    # slam_toolbox can transform this frame to base_footprint through TF.
    target_frame: lidar_stabilized

    transform_tolerance: 0.3       # [s] TF lookup timeout for cloud->scan projection

    # Height filter relative to lidar_stabilized.
    # A slightly wider band improves scan density in sparse indoor scenes while
    # still rejecting the floor, which sits roughly 0.23 m below the sensor.
    min_height: -0.12
    max_height: 0.12

    # Angular scan parameters
    angle_min: -3.14159265         # [rad] -180 deg
    angle_max:  3.14159265         # [rad] +180 deg
    # Use finer bins than the raw 1 degree setting so sparse walls/corners are
    # less likely to disappear during PointCloud2 -> LaserScan rasterization.
    angle_increment: 0.00872665    # [rad] 0.5 deg

    scan_time: 0.1                 # [s] 10 Hz
    range_min: 0.15                # [m]  reject near-body clutter
    range_max: 25.0                # [m]  slightly wider indoor mapping range without going overly noisy

    use_inf: true                   # Preserve free-space rays for scan-based SLAM
    inf_epsilon: 1.0               # [m] inf offset
