collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_collision_free"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # Go2 has a rectangular standing envelope (about 0.70 m x 0.31 m), so
    # polygon zones fit this quadruped better than circular shells indoors.
    # Humble uses max_points semantics: action triggers when points_inside > max_points.
    polygons: ["CautionZone", "SlowZone", "StopZone"]

    CautionZone:
      type: "polygon"
      points: [0.80, 0.50, 0.80, -0.50, -0.80, -0.50, -0.80, 0.50]
      action_type: "slowdown"
      slowdown_ratio: 0.90
      max_points: 5
      visualize: True
      polygon_pub_topic: "/collision_monitor/caution_zone"
      enabled: True

    SlowZone:
      type: "polygon"
      points: [0.60, 0.40, 0.60, -0.40, -0.50, -0.40, -0.50, 0.40]
      action_type: "slowdown"
      slowdown_ratio: 0.70
      max_points: 3
      visualize: True
      polygon_pub_topic: "/collision_monitor/slow_zone"
      enabled: True

    StopZone:
      type: "polygon"
      points: [0.42, 0.22, 0.42, -0.22, -0.42, -0.22, -0.42, 0.22]
      action_type: "stop"
      max_points: 2
      visualize: True
      polygon_pub_topic: "/collision_monitor/stop_zone"
      enabled: True

    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/lidar/points_undistorted"
      min_height: 0.08
      max_height: 2.3
      enabled: True
