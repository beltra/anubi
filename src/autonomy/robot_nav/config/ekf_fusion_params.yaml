# EKF placeholder for body odom + IMU + optional LiDAR odom fusion.
# Not wired into bringup by default. Enable explicitly when the robot provides
# /odom_raw, /imu/data, and optionally /lidar_odom.
#
# Frame ownership:
#   map->odom        : slam_toolbox (or AMCL)
#   odom->base_*     : this EKF

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [true,  true,  false,
                   false, false, true,
                    true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    odom1: /lidar_odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                    true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
