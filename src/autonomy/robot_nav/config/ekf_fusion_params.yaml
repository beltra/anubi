# EKF for body odom + IMU fusion (non-LIO mode, use_lio:=false).
#
# Frame ownership:
#   map->odom        : slam_toolbox (or AMCL)
#   odom->base_*     : this EKF
#
# Source roles:
#   odom0 (/odom_raw)  : Sport Mode wheel/leg odometry -- absolute x/y position,
#                        linear velocity, and angular velocity. Yaw_position is
#                        deliberately excluded: providing absolute yaw from both
#                        /odom_raw and /imu/data trips robot_localization's
#                        "2 absolute pose inputs for YAW" warning and produces
#                        oscillations. The IMU is the single absolute yaw source.
#   imu0  (/imu/data)  : body IMU -- absolute yaw + angular velocity.
#
# This file is loaded when use_lio:=false.
# go2_bringup selects ekf_fusion_params_lio.yaml instead when use_lio:=true.

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    # print_diagnostics: true causes the EKF's diagnostic_updater path to
    # repeatedly hit the TF buffer and trigger
    #   "tf2_buffer: Detected jump back in time. Clearing TF buffer."
    # at ~40 Hz, collapsing /odom output to ~5 Hz. Offline replay confirmed:
    # toggling this to false on its own restores /odom to ~44 Hz (essentially
    # the configured 50 Hz minus startup/shutdown loss). See
    # docs/ekf_rate_diag.md for the full diagnosis.
    print_diagnostics: false
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- Sport Mode leg odometry (absolute x/y position + linear/angular velocity) ---
    # Index 5 (yaw_position) is false: /imu/data is the only absolute yaw source.
    # Layout: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom_raw
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # --- Body IMU (absolute yaw + angular velocity) ---
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
