# EKF for body odom + IMU fusion (non-LIO mode, use_lio:=false).
#
# Frame ownership:
#   map->odom        : slam_toolbox (or AMCL)
#   odom->base_*     : this EKF
#
# Source roles:
#   odom0 (/odom_raw)  : Sport Mode wheel/leg odometry -- absolute position + velocity.
#                        Primary position source when DLIO is not running.
#   imu0  (/imu/data)  : body IMU -- absolute yaw + angular velocity.
#
# This file is loaded when use_lio:=false.
# go2_bringup selects ekf_fusion_params_lio.yaml instead when use_lio:=true.

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- Sport Mode leg odometry (absolute position + velocity) ---
    odom0: /odom_raw
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # --- Body IMU (absolute yaw + angular velocity) ---
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
