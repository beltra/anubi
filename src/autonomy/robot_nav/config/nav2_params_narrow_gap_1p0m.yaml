# nav2_params_narrow_gap_1p0m.yaml
# Narrow-gap STVL profile tuned for 1.0 m passages.
# map->odom comes from slam_toolbox. odom->base_footprint comes from robot odometry.
# use_sim_time is rewritten at launch.
# lifecycle_manager below is reference only when using nav2_bringup.

# amcl - Adaptive Monte Carlo Localization
# Used when navigating on a pre-built map.  Disabled when using SLAM-only mode.
# Localization tuning backlog: tune alpha, laser, and initial pose params for Go2 IMU motion.
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

# map_server
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""  # Overridden via launch argument --map

# map_saver
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# planner_server
# Uses SmacPlannerLattice for reliable global path planning in grid maps.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0        # Go2 can walk backward but forward is preferred
      change_penalty: 0.05        # low: direction changes are cheap for legged robots
      non_straight_penalty: 1.05  # very low: diagonal travel is fine
      # Increase obstacle-cost sensitivity so global plans stay farther from walls.
      cost_penalty: 3.0
      rotation_penalty: 5.0       # moderate: rotation costs energy but is not forbidden
      retrospective_penalty: 0.025
      lattice_filepath: "./lattice_omni_5.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

# controller_server
# Uses MPPI with an additional DWB controller for narrow-gap behavior.
controller_server:
  ros__parameters:
    use_sim_time: true
    # Keep period (1/frequency) comfortably below model_dt (0.05 s).
    controller_frequency: 25.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5      # was 0.3 (6 cycles) - too short; 0.5 s = 10 cycles before recovery
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathDWB"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      # Keep checking XY while aligning yaw to prevent orbiting around the goal.
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      transform_tolerance: 0.5
      prune_distance: 1.7

      # MPPI rollout horizon stays close to the previous DWB horizon (1.2 s).
      time_steps: 24
      model_dt: 0.05
      batch_size: 1200
      iteration_count: 1
      retry_attempt_limit: 1
      temperature: 0.3
      gamma: 0.015
      reset_period: 1.0
      regenerate_noises: false
      visualize: false

      # Velocity and acceleration envelopes match the maintained Go2 stack.
      vx_max: 1.0
      vx_min: 0.0
      vy_max: 0.25
      wz_max: 0.9
      ax_max: 0.6
      ax_min: -0.8
      ay_max: 0.4
      ay_min: -0.5
      az_max: 0.8
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.3

      # Keep path tracking goal-aware, obstacle-aware, and biased against yaw-only twirling.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "TwirlingCritic", "VelocityDeadbandCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.7
        critical_weight: 20.0
        collision_cost: 1000000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.35
        consider_footprint: true
        inflation_radius: 0.30
        cost_scaling_factor: 3.2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.20

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.6
        offset_from_furthest: 10
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.9
        forward_preference: false

      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.0, 0.0, 0.01]

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

    FollowPathDWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Go2 can command lateral velocity; keep moderate lateral limits for stability.
      holonomic: true
      # DWB does not define a separate footprint polygon here; it inherits
      # collision geometry from the active local/global costmap footprint.

      # Velocity limits - matched to gait.yaml and go2_params.yaml limits
      min_vel_x: 0.0
      min_vel_y: -0.4
      max_vel_x: 1.0
      max_vel_y: 0.25
      min_vel_theta: 0.0
      max_vel_theta: 0.9
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.05

      # Acceleration limits
      acc_lim_x: 0.6
      acc_lim_y: 0.4
      acc_lim_theta: 0.8
      decel_lim_x: -0.8
      decel_lim_y: -0.5
      decel_lim_theta: -1.2

      # Sampling - extra vy samples for richer holonomic coverage
      vx_samples: 14
      vy_samples: 8
      vtheta_samples: 14
      sim_time: 1.1
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # DWB critics
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]

      # Raise near-obstacle penalty to better match collision monitor safety envelope.
      ObstacleFootprint.scale: 3.0
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 20.0
      GoalDist.scale: 14.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0  # -1.0 = auto-compute from current speed

# local_costmap
# Uses STVL for rolling 3-D obstacle handling from the LiDAR point cloud.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: "base_footprint"
      rolling_window: true
      width:  20
      height: 20
      resolution: 0.05
      update_frequency:  10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      # Narrow-gap profile: uses physical standing envelope (0.70 x 0.31 m) without safety margin
      # to reduce costmap footprint for tighter passages (target 1.0 m gap).
      # Footprint polygon = 0.70 m length (+/-0.35) x 0.31 m width (+/-0.155).
      footprint: "[ [-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155] ]"
      footprint_padding: 0.0

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5          # fast ghost clearing - approx 1 gait cycle instead of 4
        decay_model: 0            # 0 = linear decay
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.1  # tighter TF lookup avoids using stale trunk pose
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark
        lidar_mark:
          data_type: PointCloud2
          topic: /lidar/points_undistorted
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 10.0
          # Lower threshold to keep short obstacles (pallets, low boxes) visible.
          min_obstacle_height: 0.10
          max_obstacle_height: 2.3
          expected_update_rate: 0.0      # 0.0 = accept updates at any rate (LiDAR publishes at 10 Hz)
          observation_persistence: 0.0   # 0.0 = discard raw observations immediately; voxel_decay handles temporal filtering
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2       # require 2 hits before marking - rejects single-point ghost returns
          clear_after_reading: true
          sensor_origin_frame: lidar_stabilized  # gravity-levelled frame; imu_stabilized_tf tracks physical sensor position
          max_z: 2.5    # STVL voxel volume upper bound (m above lidar_link origin; covers standing humans)
          # Allow a small below-sensor band to detect low obstacles without opening full floor returns.
          min_z: -0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Reduced inflation to match narrow-gap footprint.
        # With 0.31 m footprint width + 0.30 m inflation = 0.91 m costmap width in 1.0 m gap.
        cost_scaling_factor: 3.2
        inflation_radius: 0.30
        inflate_unknown: false
        inflate_around_unknown: false

# global_costmap
# Global obstacle costmap from /lidar/points_undistorted.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint

      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: false
      qos_overrides:
        /lidar/points_undistorted:
          subscription:
            reliability: best_effort
            durability: volatile

      footprint: "[ [-0.35, -0.155], [-0.35, 0.155], [0.35, 0.155], [0.35, -0.155] ]"
      footprint_padding: 0.0

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.10
        max_obstacle_height: 2.3
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: cloud
        cloud:
          topic: /lidar/points_undistorted
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.10
          max_obstacle_height: 2.5
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.05
          raytrace_max_range: 10.0
          inf_is_valid: false
          expected_update_rate: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Keep global path generation consistent with local clearance preference.
        # Slightly higher inflation for global planner smoothing without entering standing footprint.
        cost_scaling_factor: 3.2
        inflation_radius: 0.32
        inflate_unknown: false
        inflate_around_unknown: false

# bt_navigator
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Default Nav2 BT - handles replanning and recovery automatically
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Plugin list verified against libraries present in ros-humble-navigation2.
    # Checked via: find /opt/ros/humble/lib -name "libnav2*bt*" | sort
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_wait_action_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_back_up_action_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_progress_checker_selector_bt_node

# behavior_server  (recovery behaviours)
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic:  local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic:  local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.9
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.8
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

# waypoint_follower
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# velocity_smoother
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # All limits kept consistent with DWB and gait.yaml [vx, vy, wz]
    max_velocity: [1.0, 0.25, 0.9]
    min_velocity: [0.0, -0.25, -0.9]
    max_accel: [0.6, 0.4, 0.8]
    max_decel: [-0.8, -0.5, -1.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.01]
    velocity_timeout: 1.0

# lifecycle_manager  (navigation)
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # slam_toolbox and map_server are NOT in this list:
    #   - slam_toolbox manages its own lifecycle.
    #   - map_server is not needed when slam_toolbox provides the map.
    # Add map_server + amcl here if switching to AMCL + pre-built map mode.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
