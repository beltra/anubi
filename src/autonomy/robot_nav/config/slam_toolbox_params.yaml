# slam_toolbox async SLAM parameters (mapping and localization modes).
# SLAM mode is selected by the launch executable, not by this file.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /scan

    use_map_saver: true
    mode: mapping

    # Mapping should not memorize every transient object endpoint. Accept scans
    # only after meaningful motion/time so moving obstacles get fewer votes in
    # the persistent pose graph.
    minimum_travel_distance: 0.30  # [m]
    minimum_travel_heading: 0.25   # [rad]
    minimum_time_interval:  0.50   # [s]

    use_scan_matching:   true
    use_scan_barycenter: true

    resolution: 0.05
    # 0.05 m cells and 0.5 deg scans become sparse at long range; limiting the
    # rasterized range keeps free/occupied evidence dense enough to clear
    # transient marks while still covering the local indoor map.
    max_laser_range: 10.0
    # Keep this just above scan.range_min so slam_toolbox does not clip it and
    # warn during sensor registration.
    min_laser_range: 0.21

    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine:   0.45

    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0
    scan_queue_size: 1
    throttle_scans: 1

    # Require more than a one-off hit before a cell is called occupied. A moving
    # obstacle can still appear briefly, but a few later pass-through beams will
    # return that cell to free instead of leaving black dots in the saved map.
    min_pass_through: 3
    occupancy_threshold: 0.30

    link_match_minimum_response_fine:   0.1
    link_scan_maximum_distance:         1.5
    loop_search_maximum_distance:       3.0

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty:    1.0

    fine_search_angle_offset:     0.00349
    coarse_search_angle_offset:   0.349
    coarse_angle_resolution:      0.0349
    minimum_angle_penalty:        0.9
    minimum_distance_penalty:     0.5
    use_response_expansion:       true

    transform_publish_period:     0.02
    transform_timeout:            0.5
    tf_buffer_duration:          30.0
    # Reduced from 1.0 to 0.3: pose graph optimized 3x more often, making each
    # map->odom correction smaller and reducing visible 1 Hz map jumps.
    map_update_interval:          0.5
    map_start_at_dock:           false
