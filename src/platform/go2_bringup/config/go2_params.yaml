# Go2-specific parameters consumed by go2_bringup.

go2_hw_bridge:
  ros__parameters:
    state_topic:     "/sportmodestate"
    lowstate_topic:  "/lowstate"
    cmd_vel_topic:   "/cmd_vel"
    sport_req_topic: "/api/sport/request"
    odom_topic:      "/odom_raw"   # EKF fusion remaps this to /odom
    imu_topic:       "/imu/data"

    odom_frame:      "odom"
    base_frame:      "base_footprint"
    base_link_frame: "base_link"
    imu_frame:       "imu_link"
    publish_tf:      false         # EKF owns odom->base TF
    publish_body_tf: true
    standing_height: 0.28

    cmd_timeout: 0.5
    enable_startup_motion_sequence: true
    # enable_goal_motion_sequence: re-runs RecoveryStand -> StandUp ->
    # ClassicWalk on the first nav goal. With enable_startup_motion_sequence
    # already running it at boot, this is redundant and forces a 4 s
    # StopMove-only window right after the first goal is accepted. Bag
    # go2_real_mapping_20260513_172927 shows the robot commanded at 0.82 m/s
    # for 2.5 s with zero translation during this window (t=29.35..31.85).
    # Default off; the startup sequence already gets the robot into walking
    # mode before Nav2 starts.
    enable_goal_motion_sequence: false
    startup_standup_delay_sec: 1.0
    startup_classic_walk_delay_sec: 3.0
    nav_goal_status_topic: "/navigate_to_pose/_action/status"

    max_linear_vel:  1.5
    max_lateral_vel: 0.4
    max_angular_vel: 1.8

robot_state_publisher:
  ros__parameters:
    publish_frequency: 50.0
