# Go2-specific parameters consumed by go2_bringup.

go2_hw_bridge:
  ros__parameters:
    state_topic:     "/sportmodestate"
    lowstate_topic:  "/lowstate"
    cmd_vel_topic:   "/cmd_vel"
    sport_req_topic: "/api/sport/request"
    odom_topic:      "/odom_raw"   # EKF fusion remaps this to /odom
    imu_topic:       "/imu/data"

    odom_frame:      "odom"
    base_frame:      "base_footprint"
    base_link_frame: "base_link"
    imu_frame:       "imu_link"
    publish_tf:      false         # EKF owns odom->base TF
    publish_body_tf: true
    standing_height: 0.28

    cmd_timeout: 0.5

    max_linear_vel:  1.5
    max_lateral_vel: 0.4
    max_angular_vel: 1.8

robot_state_publisher:
  ros__parameters:
    publish_frequency: 50.0
