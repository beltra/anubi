# g1_sonic_walk_params.yaml
# cmd_vel_to_sonic profile: WALK -- the faster envelope for after slow_walk has
# been validated on hardware. vx 0.8 is the top of the band the sonic deployment
# docs exercise for navigation; wz 0.5 matches its turn demos (SONIC documents NO
# yaw-rate limit, so this value is validated empirically, not from a spec).
# MUST match robot_nav/config/nav2_params_g1_sonic_walk.yaml.
# The AMO configuration (g1_params.yaml, nav2_params_g1.yaml) is untouched by this.
cmd_vel_to_sonic:
  ros__parameters:
    # Safety-gated velocity topic (robot_safety velocity_limiter output).
    cmd_vel_topic:   "/cmd_vel_safe"
    # Measured yaw source for the closed-loop body->world conversion. /odom is the
    # EKF-fused body pose (owns odom->base_footprint, present in sim and real);
    # set to /lidar_odom to anchor directly on DLIO instead.
    odom_topic:      "/odom"
    # ZMQ PUB endpoint THIS node binds; g1_deploy_onnx_ref connects to it
    # (--zmq-host <nav host> --zmq-port 5556 on the Jetson).
    zmq_bind_host:   "*"
    zmq_port:        5556
    # Planner tick rate (SONIC planner treats a ~1 s gap as command loss).
    rate_hz:         30.0
    # LocomotionMode 2 = WALK (planner-default speed band).
    locomotion_mode: 2
    # Velocity caps in REALIZED [m/s, m/s, m/s, rad/s]; clamped BEFORE speed_gain.
    # max_reverse_vel is a positive magnitude. wz has NO downstream clamp in the
    # SONIC stack -- this cap and Nav2 wz_max are the only yaw limits.
    max_forward_vel: 0.8
    max_reverse_vel: 0.3
    max_lateral_vel: 0.4
    max_yaw_rate:    0.5
    # Compensates the SONIC planner's ~0.85x speed realization (1.18 ~= 1/0.85).
    speed_gain:      1.18
    # Closed-loop turn intent: `facing` leads the measured heading by wz * this.
    # MUST be > 0 or the robot never turns (it is the whole turning mechanism).
    facing_lookahead_sec: 0.4
    # Watchdog: IDLE if cmd_vel is silent; chain publishes at 20 Hz -> 0.3 s.
    cmd_timeout:     0.3
    # Idempotent start/planner-mode command re-send period.
    start_resend_sec: 1.0
    # Settle after the start handshake before subscribing (soft-hold -> planner switch).
    start_settle_sec: 1.0
    # Idle heading hold: absorb slow yaw drift, follow real rotation (wrong-way-turn fix).
    hold_drift_absorb_rad_s: 0.01
    # Replan-storm guard: deadband the sent movement/facing/speed so a steady walk emits
    # a byte-identical vector (SONIC skips its ~28 ms replan; protects LowState/RT loop).
    movement_deadband_rad: 0.05
    facing_deadband_rad:   0.05
    speed_deadband:        0.03
