    goals:
      - name: ne_corner
        x: 8.0
        y: 5.0
        yaw: 0.0
      - name: nw_corner
        x: -8.0
        y: 5.0
        yaw: 3.14
      - name: se_corner
        x: 8.0
        y: -5.0
        yaw: 0.0
      - name: sw_corner
        x: -8.0
        y: -5.0
        yaw: 3.14
